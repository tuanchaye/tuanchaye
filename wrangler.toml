# Cloudflare Workers Static Assets 配置
# Astro 保持纯静态构建（output: static），构建产物 dist 作为静态资源。
# Worker 入口为 worker/index.js，负责处理 /auth、/callback 以及回退到静态资源。

name = "tuanchaye"
main = "worker/index.js"
compatibility_date = "2024-10-17"

[observability]
enabled = true

[vars]
# GitHub OAuth App 的 Client ID（公开，可写在此处）
GITHUB_CLIENT_ID = "Ov23li8laTinERnLyBux"

[assets]
directory = "./dist"
binding = "ASSETS"
# 先跑 Worker（语言协商、尾斜杠 301、auth/API），未命中再回落静态资源；
# 不开启时静态资源层会绕过 Worker 直接返回（尾斜杠 307 无法升级为 301）
run_worker_first = true
# SEO：无尾斜杠地址直接 200 返回（与 sitemap/canonical 一致）；
# 带斜杠地址由 Worker 301 到无斜杠，避免临时重定向稀释排名信号
html_handling = "drop-trailing-slash"

# 点赞 / 收藏计数（全局聚合计数）
[[kv_namespaces]]
binding = "TEAKV"
id = "207c5c3f840f4119ab61287be5471bfd"

# 评论存储（含内容过滤后落库）
[[d1_databases]]
binding = "TEADB"
database_name = "tuanchaye-db"
database_id = "deefb693-c521-450c-b723-e34c5af18fe1"
