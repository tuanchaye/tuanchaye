name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要 write 权限，以便把自动生成的译文回写仓库
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 自动翻译：仅在配置了翻译 API Key 时执行 ──
      # 脚本会跳过已存在的译文，因此只有“新增的英文文章”才会被翻译，
      # 后续每次推送都只翻译新文章，不会重复消耗额度。
      - name: Auto-translate new articles
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            echo "🔁 检测到翻译 API Key，开始自动翻译新增文章…"
            node scripts/translate.mjs
          else
            echo "⚠️ 未配置 DEEPSEEK_API_KEY / OPENAI_API_KEY，跳过自动翻译（文章将以英文回退展示）。"
          fi

      # ── 把本次生成的译文回写仓库（带 [skip ci] 避免触发无限循环）──
      # continue-on-error：若与后台连续发布的提交撞车（push 被拒），不阻断后续 Build/Deploy
      - name: Commit back generated translations
        continue-on-error: true
        run: |
          git add src/content/posts
          if git diff --cached --quiet; then
            echo "ℹ️ 无新增译文，跳过提交。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: auto-translate new articles [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # ── 外链图片自动转存：把正文里的第三方图床/生图空间图片下载进本站并改写链接 ──
      # 防止外部图床（如 s.coze.cn / bytemimg 签名链接，约 1 年有效期）到期后全站图片失效。
      - name: Mirror external images into the repo
        continue-on-error: true
        run: node scripts/mirror-images.mjs

      # ── 把本次转存的图片与链接改写回写仓库（带 [skip ci] 避免无限循环）──
      # continue-on-error：与后台连续发布撞车时不阻断后续 Build/Deploy
      - name: Commit back mirrored images
        continue-on-error: true
        run: |
          git add src/content/posts public/images/mirrored
          if git diff --cached --quiet; then
            echo "ℹ️ 无新转存图片，跳过提交。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: mirror external images into repo [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: npm run build

      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 百度普通收录 API 推送：部署完成后把最新 URL 提交给百度 ──
      - name: Baidu URL push
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: node scripts/baidu-push.mjs
