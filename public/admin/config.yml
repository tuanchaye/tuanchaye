backend:
  name: github
  # 仓库名已改为你的真实 GitHub（上线指引第 2 步建好同名仓库后生效）
  repo: tuanchaye/tuanchaye
  branch: main
  # GitHub OAuth App 的 Client ID（已在 2026-10-17 创建并填入）
  client_id: Ov23li8laTinERnLyBux
  # 自定义 OAuth 代理：绕过 Decap 默认的 Netlify 网关（api.netlify.com/auth 会 404）
  # 使用 Cloudflare Workers Static Assets + wrangler.toml + worker/index.js
  # 部署与密钥配置步骤见 DECAP_AUTH.md
  # 注意：base_url 末尾不要带斜杠
  base_url: https://tuanchaye.com
  auth_endpoint: /auth

# Decap 后台语言（界面）
locale: en

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Tea Articles"
    label_singular: "Tea Article"
    folder: "src/content/posts/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Meta Description", widget: string }
      - { name: pubDate, label: "Publish Date", widget: datetime, required: false }
      - name: category
        label: "Category"
        widget: select
        required: false
        options:
          - "Tea Basics"
          - "Tea Types"
          - "Brewing"
          - "Culture"
          - "Buying Guide"
          - "Care & Wellbeing"
      - name: cover
        label: "Cover Image (optional)"
        widget: select
        required: false
        comment: "Pick a cover illustration. If left empty, a category default is used automatically."
        options:
          - { label: "Auto (by category)", value: "" }
          - { label: "Tea Basics", value: "/images/covers/overview.svg" }
          - { label: "Tea Types", value: "/images/covers/types.svg" }
          - { label: "Green Tea", value: "/images/covers/green.svg" }
          - { label: "Black Tea", value: "/images/covers/black.svg" }
          - { label: "White Tea", value: "/images/covers/white.svg" }
          - { label: "Oolong", value: "/images/covers/oolong.svg" }
          - { label: "Pu-erh", value: "/images/covers/puerh.svg" }
          - { label: "Matcha", value: "/images/covers/matcha.svg" }
          - { label: "Yellow Tea", value: "/images/covers/yellow.svg" }
          - { label: "Brewing", value: "/images/covers/brewing.svg" }
          - { label: "Tea Cup", value: "/images/covers/cup.svg" }
          - { label: "Ceremony / Culture", value: "/images/covers/ceremony.svg" }
          - { label: "Buying Guide", value: "/images/covers/buying.svg" }
          - { label: "Storage", value: "/images/covers/storage.svg" }
          - { label: "Health", value: "/images/covers/health.svg" }
          - { label: "Seasons", value: "/images/covers/seasons.svg" }
          - { label: "Gift", value: "/images/covers/gift.svg" }
          - { label: "Tasting", value: "/images/covers/tasting.svg" }
          - { label: "Food Pairing", value: "/images/covers/pairing.svg" }
          - { label: "Water", value: "/images/covers/water.svg" }
      - { name: body, label: "Body (Markdown)", widget: richtext, modes: [raw, rich_text] }
