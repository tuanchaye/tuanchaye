backend:
  name: github
  # 上线前把下面两行改成你的 GitHub 用户名和仓库名
  repo: YOUR_GITHUB_USERNAME/tuanchaye
  branch: main

# Decap 后台语言（界面）
locale: en

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Tea Articles"
    label_singular: "Tea Article"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Meta Description", widget: string }
      - { name: pubDate, label: "Publish Date", widget: datetime, required: false }
      - { name: category, label: "Category", widget: string, required: false }
      - { name: body, label: "Body (Markdown)", widget: markdown }
