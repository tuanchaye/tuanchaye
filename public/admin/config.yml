backend:
  name: github
  # 仓库名已改为你的真实 GitHub（上线指引第 2 步建好同名仓库后生效）
  repo: tuanchaye/tuanchaye
  branch: main
  # 在 GitHub 创建 OAuth App 后，把它的 Client ID 填到这里（见上线指引第 4 步）
  # 创建位置：GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
  # Homepage URL 与 Authorization callback URL 都填：https://tuanchaye.com/admin/
  # （上线前若自定义域未生效，可先用 https://<你的pages.dev地址>/admin/）
  client_id: YOUR_OAUTH_CLIENT_ID

# Decap 后台语言（界面）
locale: en

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Tea Articles"
    label_singular: "Tea Article"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Meta Description", widget: string }
      - { name: pubDate, label: "Publish Date", widget: datetime, required: false }
      - { name: category, label: "Category", widget: string, required: false }
      - { name: body, label: "Body (Markdown)", widget: markdown }
