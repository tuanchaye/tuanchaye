backend:
  name: github
  # 仓库名已改为你的真实 GitHub（上线指引第 2 步建好同名仓库后生效）
  repo: tuanchaye/tuanchaye
  branch: main
  # GitHub OAuth App 的 Client ID（已在 2026-10-17 创建并填入）
  # OAuth App 位置：GitHub → Settings → Developer settings → OAuth Apps
  # Homepage URL: https://tuanchaye.zhishuyunqi001.workers.dev
  # Authorization callback URL: https://tuanchaye.zhishuyunqi001.workers.dev/admin/
  # 绑定 tuanchaye.com 后，回调地址需同步改为 https://tuanchaye.com/admin/
  client_id: Ov23li8laTinERnLyBux

# Decap 后台语言（界面）
locale: en

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Tea Articles"
    label_singular: "Tea Article"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Meta Description", widget: string }
      - { name: pubDate, label: "Publish Date", widget: datetime, required: false }
      - { name: category, label: "Category", widget: string, required: false }
      - { name: body, label: "Body (Markdown)", widget: markdown }
