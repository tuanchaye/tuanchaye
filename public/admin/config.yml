backend:
  name: github
  # 仓库名已改为你的真实 GitHub（上线指引第 2 步建好同名仓库后生效）
  repo: tuanchaye/tuanchaye
  branch: main
  # GitHub OAuth App 的 Client ID（已在 2026-10-17 创建并填入）
  client_id: Ov23li8laTinERnLyBux
  # 自定义 OAuth 代理：绕过 Decap 默认的 Netlify 网关（api.netlify.com/auth 会 404）
  # 使用 Cloudflare Workers Static Assets + wrangler.toml + worker/index.js
  # 部署与密钥配置步骤见 DECAP_AUTH.md
  # 注意：base_url 末尾不要带斜杠
  base_url: https://tuanchaye.com
  auth_endpoint: /auth

# Decap 后台语言（界面）
locale: en

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Tea Articles"
    label_singular: "Tea Article"
    folder: "src/content/posts/en"
    create: true
    slug: "{{slug}}"
    # 后台列表可按发布日期/标题排序（点 Sort by 选 pubDate，再点一次切换倒序=最新在最上）
    sortable_fields:
      - pubDate
      - title
    # 按栏目筛选（Filter 按钮）
    view_filters:
      - label: Tea Basics
        field: category
        pattern: "Tea Basics"
      - label: Tea Types
        field: category
        pattern: "Tea Types"
      - label: Brewing
        field: category
        pattern: "Brewing"
      - label: Culture
        field: category
        pattern: "Culture"
      - label: Buying Guide
        field: category
        pattern: "Buying Guide"
      - label: Care & Wellbeing
        field: category
        pattern: "Care & Wellbeing"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Meta Description", widget: string }
      - { name: pubDate, label: "Publish Date", widget: datetime, required: false }
      - name: category
        label: "Category"
        widget: select
        required: false
        options:
          - "Tea Basics"
          - "Tea Types"
          - "Brewing"
          - "Culture"
          - "Buying Guide"
          - "Care & Wellbeing"
      - name: cover
        label: "Cover Image (optional)"
        widget: image
        required: false
        comment: "Upload your own cover image (landscape, ~1600px wide recommended). NOTE: the preview here shows broken until you click Save and CI finishes deploying (~2-3 min) - this is normal for static-site CMS. If left empty, a category default is used automatically."
      - { name: pinned, label: "Pin to Top（置顶）", widget: boolean, required: false, default: false }
      - { name: comments, label: "Allow Comments（开放评论）", widget: boolean, required: false, default: true }
      - { name: body, label: "Body (Markdown)", widget: richtext, modes: [raw, rich_text] }
