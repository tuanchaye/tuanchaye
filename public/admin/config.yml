backend:
  name: github
  # 仓库名已改为你的真实 GitHub（上线指引第 2 步建好同名仓库后生效）
  repo: tuanchaye/tuanchaye
  branch: main
  # GitHub OAuth App 的 Client ID（已在 2026-10-17 创建并填入）
  client_id: Ov23li8laTinERnLyBux
  # 自定义 OAuth 代理：绕过 Decap 默认的 Netlify 网关（api.netlify.com/auth 会 404）
  # 该 Worker 代码见 workers/oauth-proxy.js，部署步骤见 DECAP_AUTH.md
  # 注意：base_url 末尾不要带斜杠
  base_url: https://tuanchaye-oauth.zhishuyunqi001.workers.dev
  auth_endpoint: /auth

# Decap 后台语言（界面）
locale: en

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Tea Articles"
    label_singular: "Tea Article"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Meta Description", widget: string }
      - { name: pubDate, label: "Publish Date", widget: datetime, required: false }
      - { name: category, label: "Category", widget: string, required: false }
      - { name: body, label: "Body (Markdown)", widget: markdown }
