<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager · TuanChaYe</title>
  </head>
  <body>
    <!-- 固定版本：3.17.1。旧 markdown 组件粘贴富文本会崩溃（上游 #7790），已改用 richtext 组件 -->
    <!-- 自托管 decap-cms.js（原 unpkg CDN）：国内访问更稳，且不依赖第三方可用性 -->
    <!-- fetch 重试垫片：同源 GET 失败自动重试 4 次（网络抖动时 config.yml 一次失败即报错，无内建重试） -->
    <script>
      (function () {
        var orig = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          var method = (init && init.method) || 'GET';
          var sameOriginGet = method === 'GET' && url.charAt(0) === '/';
          if (!sameOriginGet) return orig.apply(this, arguments);
          return new Promise(function (resolve, reject) {
            var n = 0;
            var attempt = function () {
              orig.call(window, input, init).then(resolve).catch(function (e) {
                if (++n >= 4) reject(e);
                else setTimeout(attempt, 600 * n);
              });
            };
            attempt();
          });
        };
      })();
    </script>
    <!-- 动态加载 decap-cms.js：失败自动重试（换 cache-bust 参数），带可见状态提示；多次失败给出网络建议 -->
    <div id="boot-status" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:14px/1.6 system-ui,sans-serif;color:#555;"></div>
    <script>
      (function () {
        var el = document.getElementById('boot-status');
        function status(t) { if (el) el.textContent = t; }
        var tries = 0;
        function addScript() {
          tries++;
          if (tries > 12) {
            status('后台脚本多次加载失败，当前网络到站点不稳定。建议：开启代理（VPN）后刷新页面重试。');
            return;
          }
          status('正在加载后台（第 ' + tries + ' 次）…');
          var s = document.createElement('script');
          s.src = 'decap-cms.js?r=' + Date.now(); // 失败后换参数，避免命中坏缓存
          s.onload = function () { status('正在初始化…'); };
          s.onerror = function () {
            s.remove();
            setTimeout(addScript, 1200);
          };
          document.body.appendChild(s);
        }
        addScript();
      })();
    </script>
  </body>
</html>
